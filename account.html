<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#08080a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Мои фильмы">
  <title>Профиль — Мой список фильмов</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="psychTest.css">
  <link rel="stylesheet" href="visualTest.css">
  <link rel="stylesheet" href="shortVisualTest.css">
  <link rel="stylesheet" href="appShell.css">
  <link rel="stylesheet" href="mobile.css">
  <script src="theme.js"></script>
  <script src="i18n.js"></script>
  <script src="mobileShell.js"></script>
</head>
<body data-page="account">

  <div id="login-overlay" class="login-overlay">
    <div class="login-card">
      <button type="button" id="login-close" class="login-close" aria-label="Закрыть">✕</button>
      <h1>Мой список фильмов</h1>
      <p id="login-intro" class="login-intro">Войдите по номеру телефона, чтобы открыть профиль и сохранять прогресс.</p>
      <p id="open-via-server-hint" class="server-hint hidden"></p>
      <form id="auth-phone-form" class="auth-form">
        <input type="tel" id="auth-phone" placeholder="Номер телефона" required autocomplete="tel" inputmode="tel">
        <button type="submit">Получить код</button>
      </form>
      <form id="auth-code-form" class="auth-form hidden">
        <input type="text" id="auth-code" placeholder="Код из SMS" required autocomplete="one-time-code" inputmode="numeric" maxlength="6">
        <button type="submit">Войти</button>
      </form>
      <p id="auth-error" class="auth-error"></p>
      <p id="auth-code-hint" class="auth-hint hidden">Отправили код на <span id="auth-phone-display"></span>. <button type="button" id="auth-code-back" class="psych-inline-login">Изменить номер</button></p>
      <p id="auth-hint-default" class="auth-hint">Без пароля. Войдём по коду из SMS. Новый номер — аккаунт создаётся автоматически.</p>
      <button type="button" id="auth-guest-btn" class="auth-guest-btn">На главную</button>
    </div>
  </div>

  <div id="app-content" class="hidden">
    <header class="app-header">
      <div class="header-inner">
        <button type="button" id="page-back" class="header-back" aria-label="Назад">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
          <span>Назад</span>
        </button>
        <a href="/" class="header-brand header-brand-link">
          <span class="site-logo" aria-hidden="true">🎬</span>
          <div class="header-brand-text">
            <h1>Мои фильмы</h1>
            <span id="user-greeting" class="user-greeting"></span>
          </div>
        </a>
        <nav class="header-nav" aria-label="Навигация">
          <a href="/" class="header-nav-link" data-page="home">Список</a>
          <a href="/battle.html" class="header-nav-link" data-page="battle">Битва фильмов</a>
        </nav>
        <div class="header-right">
          <button type="button" class="theme-toggle-btn" id="theme-toggle-btn" title="Переключить тему" aria-label="Переключить тему" aria-pressed="false"><span class="theme-toggle-icon" aria-hidden="true">🌙</span></button>
          <a href="/account.html" class="header-avatar" id="header-avatar" title="Мой аккаунт">?</a>
        </div>
      </div>
    </header>

    <main class="page-content page-content--account">
      <section class="content-section profile-card-section">
        <div id="profile-info"></div>
      </section>

      <section class="stats-section content-section">
        <h2 class="section-heading">Статистика</h2>
        <div id="stats-grid" class="stats-grid"></div>
        <h3 class="profile-subheading">Любимые жанры</h3>
        <div id="stats-genres" class="stats-genres"></div>
      </section>

      <section class="content-section profile-section">
        <h2 class="section-heading">Результаты тестов</h2>
        <div id="profile-tests-summary"></div>
      </section>

      <section class="content-section profile-logout-section">
        <button type="button" id="logout-btn" class="logout-btn profile-logout-btn">Выйти из аккаунта</button>
      </section>
    </main>
  </div>

  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modal-title"></h3>
        <button type="button" id="modal-close">✕</button>
      </div>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>

  <script src="display.js"></script>
  <script src="loadingUI.js"></script>
  <script src="guestStore.js"></script>
  <script src="script.js"></script>
  <script src="features.js"></script>
  <script src="profile.js"></script>
  <script src="visualTestScenes.js"></script>
  <script src="visualTest.js"></script>
  <script src="shortVisualTest.js"></script>
  <script src="psychTest.js"></script>
  <script src="account.js"></script>
  <script src="headerNav.js"></script>
  <script src="pwa.js"></script>
  <script src="auth.js"></script>
  <script src="appShell.js"></script>
</body>
</html>
