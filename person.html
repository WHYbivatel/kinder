<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#08080a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Профиль — Мои фильмы</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="appShell.css">
  <link rel="stylesheet" href="mobile.css">
  <script src="theme.js"></script>
  <script src="i18n.js"></script>
  <script src="mobileShell.js"></script>
</head>
<body data-page="movie">
  <header class="moviepage-topbar personpage-topbar">
    <button type="button" id="person-back" class="moviepage-back" aria-label="Назад" data-i18n="common.back">‹ Назад</button>
    <a href="/" class="moviepage-home" aria-label="На главную" data-i18n-aria="common.home">🎬</a>
  </header>

  <main id="person-root" class="moviepage" aria-live="polite">
    <div class="moviepage-loading">
      <div class="loading-ui" role="status">
        <span class="loading-ui__spinner" aria-hidden="true"></span>
        <span class="loading-ui__text" data-i18n="common.loading">Загрузка…</span>
      </div>
    </div>
  </main>

  <div id="person-toast" class="movie-toast" role="status" aria-live="polite" hidden></div>

  <script src="loadingUI.js"></script>
  <script src="person.js"></script>
</body>
</html>
